<html lang="en">
<head>

    <title>Cricket Game</title>
</head>
<body style="background:linear-gradient(to bottom, #4facfe, #00f2fe);color: black; font-style: italic;">
    <h1 style="color: rgb(3, 255, 171);"> Bat Ball Stump Game </h1>
    


    <button class="choice-button" onclick="
    const UserMsg='User choice is Bat ';
    let computerChoice=generateComputerChoice();
    console.log(`Computer choice is ${computerChoice}`);
    let resultMsg=getResult('Bat',computerChoice);
    showResult('Bat',computerChoice,resultMsg); 
    ">
    
    <img src="images2/Bat.png" alt="Bat image" class="choice-image">

    </button>


    <button class="choice-button" onclick="
     UserMsg='User choice is Ball ';
     randomNumber=Math.random()*3;
    //  computerChoice;
     computerChoice=generateComputerChoice();
     console.log(`Computer choice is ${computerChoice}`);
     resultMsg=getResult('Ball',computerChoice);
     showResult('Ball',computerChoice,resultMsg);
     ">
     
    <img src="images2/Ball.jpg" alt="Ball image" class="choice-image">

    </button>


    <button class="choice-button" onclick="

      UserMsg='User choice is Stump ';
      computerChoice=generateComputerChoice();
      console.log(`Computer choice is ${computerChoice}`);
      resultMsg=getResult('Stump',computerChoice);
      showResult('Stump',computerChoice,resultMsg);
      ">
      
    <img src="images2/Stump.jpg" alt="Bat image" class="choice-image">

    </button>



    <button class="choice-button" onclick="localStorage.clear() ;
    

    resetScore();


    ">
    
    <img src="images2/Reset.jpg" alt="Reset image" class="choice-image">

    </button>


     <h3 id="user-move"></h3>
     <h3 id="computer-move"></h3>
     <h3 id="result"></h3>
     <h3 id="score"></h3>

    <script>


    let scoreStr=localStorage.getItem('Score');

    let score;

    resetScore(scoreStr);

    function resetScore(scoreStr){
            score=scoreStr ? JSON.parse(scoreStr) : {
            win:0,
            lost:0,
            tie:0,
        };

        score.displayScore=function(){
            return `Score: Won:${score.win}, Lost:${score.lost}, Tie:${score.tie}`;
        };

        showResult();
    }

    // let score=JSON.parse(scoreStr)||{
    //     win: 0,
    //     lost: 0,
    //     tie: 0,
    // };

//     if(scoreStr !==null){
//         score=JSON.parse(scoreStr);
//     }

//     else{ 
//        score={
//         win: 0,
//         lost: 0,
//         tie: 0,
//     };
// }

    


    function generateComputerChoice(){

    let randomNumber=Math.random()*3;
    if(randomNumber>0 && randomNumber<=1){
        return 'Bat';
    }
    else if(randomNumber>1 && randomNumber<=2){
        return 'Ball';
    }
     else{
        return 'Stump';
    }
 }
    
    function getResult(userMove,computerMove){
        if(userMove==='Bat'){
            if(computerMove=='Ball'){
                score.win++;
                return 'User Won';
            }
            else if(computerMove==='Stump'){
                score.lost++;
                return 'Computer has won ';
            }
            else if(computerMove==='Bat'){
                score.tie++;
                return `It's a tie`;
            }
        }

        else if(userMove==='Ball'){
            if(computerMove==='Bat'){
                score.lost++;
                return 'Computer has won';
            }
            else if(computerMove==='Ball'){
                score.tie++;
                return `It's a tie `
            }
            else if(computerMove==='Stump'){
                score.win++;
                return 'User won ';
            }
        }

        else if(userMove==='Stump'){
            if(computerMove==='Bat'){
                score.win++;
                return 'User won ';
            }
            else if(computerMove==='Ball'){
                score.lost++;
                return 'Computer has won ';
            }
            else{
                score.tie++;
                return `It's a tie`;
            }
        }
    }

    function showResult(userMove,computerMove,getResult){

        localStorage.setItem('Score',JSON.stringify(score));
        // console.log(score);
        document.querySelector('#user-move').innerText=userMove ? `You have chosen ${userMove}` : '';

        document.querySelector('#computer-move').innerText=computerMove !== undefined ?`Computer Choice is ${computerMove}` : '';

        document.querySelector('#result').innerText=getResult !== undefined ? getResult : '';

        document.querySelector('#score').innerText=score.displayScore();



        // alert(`You have chosen ${userMove}. Computer Choice is ${computerMove} and ${getResult} 
        
        // ${score.displayScore()}`);

    }
     
    </script>
</body>
</html>
